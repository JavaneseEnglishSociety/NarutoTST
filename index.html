<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON ARENA — 4-Player Shooter</title>
<style>
/* ============================================================================
   NEON ARENA — client stylesheet
   Dark background, bright neon accents, mobile-safe layout.
   ============================================================================ */
:root{
  --bg:#05060a; --bg2:#0b0e16; --panel:#0f1420; --line:#1c2436;
  --text:#dbe4ff; --dim:#7a88ad; --accent:#39ff88; --accent2:#ff3b7a; --warn:#ffd23b;
  --p1:#39ff88; --p2:#ff3b7a; --p3:#3ba7ff; --p4:#ffd23b;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overscroll-behavior:none}
body{
  background:radial-gradient(120% 100% at 50% -10%, #0e1524 0%, var(--bg) 55%);
  color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  overflow:hidden; user-select:none;
}
button{font:inherit; cursor:pointer}
input{font:inherit}

.screen{position:fixed; inset:0; display:none}
.screen.on{display:flex}

/* ---------- Lobby ---------- */
#lobbyScreen{align-items:center; justify-content:center; flex-direction:column; padding:20px}
.title{font-size:clamp(30px,7vw,56px); font-weight:900; letter-spacing:.06em; margin:0 0 4px;
  background:linear-gradient(90deg,var(--p1),var(--p3),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 40px rgba(57,255,136,.25); text-align:center}
.subtitle{color:var(--dim); font-size:13px; letter-spacing:.18em; text-transform:uppercase; margin-bottom:28px; text-align:center}
.card{background:linear-gradient(180deg,var(--panel),#0b0f18); border:1px solid var(--line); border-radius:16px;
  padding:24px; width:min(420px,92vw); box-shadow:0 20px 60px rgba(0,0,0,.5)}
.field{margin-bottom:14px}
.field label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:6px}
.field input{width:100%; background:#080b12; border:1px solid var(--line); color:var(--text); border-radius:9px;
  padding:12px 14px; font-size:16px; letter-spacing:.04em}
.field input:focus{outline:none; border-color:var(--accent)}
#roomCodeInput{text-transform:uppercase; letter-spacing:.3em; text-align:center; font-weight:700}
.colorRow{display:flex; gap:10px; margin-bottom:16px}
.colorSwatch{width:40px; height:40px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:.15s;
  box-shadow:0 0 0 0 transparent}
.colorSwatch.sel{border-color:#fff; transform:scale(1.1)}
.btnRow{display:flex; gap:10px}
.btn{flex:1; padding:14px; border-radius:10px; border:none; font-weight:700; letter-spacing:.06em; font-size:14px; transition:.15s}
.btn.primary{background:var(--accent); color:#04140a}
.btn.primary:hover{filter:brightness(1.1)}
.btn.primary:disabled{background:#2a3346; color:#5d6785; cursor:not-allowed}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
#lobbyError{color:var(--accent2); font-size:12.5px; margin-top:10px; min-height:16px; text-align:center}

#roomPanel{width:min(420px,92vw); margin-top:16px}
#roomPanel .code{font-size:13px; letter-spacing:.2em; color:var(--dim); text-align:center; margin-bottom:10px}
#roomPanel .code b{color:var(--accent); font-size:20px; letter-spacing:.4em; margin-left:6px}
#rosterList{display:flex; flex-direction:column; gap:8px; margin:14px 0}
.rosterRow{display:flex; align-items:center; gap:10px; background:#080b12; border:1px solid var(--line); border-radius:9px; padding:9px 12px}
.rosterDot{width:14px; height:14px; border-radius:50%; flex:none; box-shadow:0 0 10px currentColor}
.rosterName{flex:1; font-size:14px}
.rosterScore{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}
#waitingHint{font-size:12px; color:var(--dim); text-align:center; margin-top:8px; line-height:1.6}

/* ---------- Game ---------- */
#gameScreen{align-items:center; justify-content:center; background:#000}
#canvasWrap{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center}
canvas{display:block; background:#060810; touch-action:none}

.hud{position:absolute; inset:0; pointer-events:none}
.hudTop{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
  padding:14px 16px; gap:10px}
#scoreBoard{display:flex; gap:8px; background:rgba(10,13,20,.7); backdrop-filter:blur(6px); border:1px solid var(--line);
  border-radius:12px; padding:8px 12px}
.scorePip{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700}
.scorePip .dot{width:10px; height:10px; border-radius:50%; box-shadow:0 0 8px currentColor}
.scoreDots{display:flex; gap:3px}
.scoreDots i{width:6px; height:6px; border-radius:50%; background:#2a3346; display:inline-block}
.scoreDots i.filled{background:currentColor; box-shadow:0 0 6px currentColor}

#selfPanel{background:rgba(10,13,20,.7); backdrop-filter:blur(6px); border:1px solid var(--line); border-radius:12px; padding:8px 12px; min-width:150px}
#selfHearts{display:flex; gap:4px; margin-bottom:6px}
.heart{width:16px; height:16px; position:relative}
.heart svg{width:100%; height:100%}
#selfPowerups{display:flex; flex-wrap:wrap; gap:4px; max-width:200px}
.puChip{font-size:9.5px; letter-spacing:.04em; background:#131a2a; border:1px solid var(--line); border-radius:6px;
  padding:2px 6px; color:var(--dim)}
.puChip b{color:var(--accent)}

#centerBanner{position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none}
#centerBanner .big{font-size:clamp(40px,9vw,90px); font-weight:900; color:#fff; text-shadow:0 0 30px rgba(255,255,255,.5)}
#centerBanner .small{font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-top:6px}

#killFeed{position:absolute; top:70px; right:16px; display:flex; flex-direction:column; gap:6px; align-items:flex-end}
.killToast{background:rgba(10,13,20,.85); border:1px solid var(--line); border-left:3px solid var(--accent2);
  border-radius:8px; padding:7px 12px; font-size:12.5px; animation:kfIn .25s ease, kfOut .4s ease 2.6s forwards}
@keyframes kfIn{from{opacity:0; transform:translateX(20px)} to{opacity:1; transform:translateX(0)}}
@keyframes kfOut{to{opacity:0}}

#reconnectOverlay{position:absolute; inset:0; background:rgba(5,6,10,.85); display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:10px; pointer-events:all}
#reconnectOverlay.on{display:flex}
.spinner{width:34px; height:34px; border:3px solid #232c42; border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Mobile joysticks */
.joyZone{position:absolute; bottom:0; width:46%; height:44%; pointer-events:all; touch-action:none}
#joyLeftZone{left:0} #joyRightZone{right:0}
.joyBase{position:absolute; width:110px; height:110px; border-radius:50%; border:2px solid rgba(255,255,255,.15);
  background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%); display:none}
.joyStick{position:absolute; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.4); left:30px; top:30px; transition:background .1s}
.joyStick.active{background:rgba(57,255,136,.35); border-color:var(--accent)}
#joyRightZone .joyStick.active{background:rgba(255,59,122,.35); border-color:var(--accent2)}

#leaveBtn{position:absolute; top:14px; left:50%; transform:translateX(-50%); pointer-events:all;
  background:rgba(10,13,20,.7); border:1px solid var(--line); color:var(--dim); font-size:11px; letter-spacing:.1em;
  padding:6px 12px; border-radius:8px}
#leaveBtn:hover{color:var(--text); border-color:var(--accent2)}

/* ---------- Match end ---------- */
#matchEndScreen{align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(120% 100% at 50% -10%,#161022,#05060a 60%)}
#confettiCanvas{position:absolute; inset:0; pointer-events:none}
.victoryWrap{position:relative; text-align:center; z-index:2}
#victoryTitle{font-size:clamp(28px,6vw,46px); font-weight:900; letter-spacing:.08em; margin-bottom:6px}
#victoryName{font-size:clamp(36px,9vw,64px); font-weight:900; text-shadow:0 0 40px currentColor}
#finalScores{display:flex; gap:12px; justify-content:center; margin:26px 0; flex-wrap:wrap}
.finalCard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:100px}
.finalCard .n{font-size:13px; color:var(--dim); margin-bottom:6px}
.finalCard .s{font-size:26px; font-weight:900}

@media (max-width:900px){
  #selfPanel{min-width:120px}
  .puChip{font-size:8.5px}
}
</style>
</head>
<body>

<!-- ============================== LOBBY ============================== -->
<div class="screen on" id="lobbyScreen">
  <div class="title">NEON ARENA</div>
  <div class="subtitle">4-Player Online Top-Down Shooter</div>

  <div class="card" id="joinCard">
    <div class="field">
      <label for="nameInput">Your Name</label>
      <input id="nameInput" maxlength="16" placeholder="Shinobi" autocomplete="off">
    </div>
    <div class="field">
      <label>Color</label>
      <div class="colorRow" id="colorRow"></div>
    </div>
    <div class="field">
      <label for="roomCodeInput">Room Code (leave blank to create one)</label>
      <input id="roomCodeInput" maxlength="4" placeholder="ABCD" autocomplete="off">
    </div>
    <div class="btnRow">
      <button class="btn primary" id="joinBtn">Join / Create Room</button>
    </div>
    <div id="lobbyError"></div>
  </div>

  <div class="card" id="roomPanel" style="display:none">
    <div class="code">ROOM CODE <b id="roomCodeDisplay">----</b></div>
    <div id="rosterList"></div>
    <div class="btnRow">
      <button class="btn primary" id="startMatchBtn" disabled>Start Match</button>
      <button class="btn ghost" id="leaveLobbyBtn">Leave</button>
    </div>
    <div id="waitingHint">Share this code with up to 3 friends.<br>Need at least 2 players to start.</div>
  </div>
</div>

<!-- ============================== GAME ============================== -->
<div class="screen" id="gameScreen">
  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <button id="leaveBtn">LEAVE MATCH</button>
      <div class="hudTop">
        <div id="scoreBoard"></div>
        <div id="selfPanel">
          <div id="selfHearts"></div>
          <div id="selfPowerups"></div>
        </div>
      </div>
      <div id="centerBanner"></div>
      <div id="killFeed"></div>
      <div id="reconnectOverlay"><div class="spinner"></div><div>Reconnecting…</div></div>
    </div>
    <!-- Mobile touch zones (shown automatically on touch devices) -->
    <div class="joyZone" id="joyLeftZone"><div class="joyBase" id="joyLeftBase"><div class="joyStick" id="joyLeftStick"></div></div></div>
    <div class="joyZone" id="joyRightZone"><div class="joyBase" id="joyRightBase"><div class="joyStick" id="joyRightStick"></div></div></div>
  </div>
</div>

<!-- ============================== MATCH END ============================== -->
<div class="screen" id="matchEndScreen">
  <canvas id="confettiCanvas"></canvas>
  <div class="victoryWrap">
    <div id="victoryTitle">VICTORY</div>
    <div id="victoryName">—</div>
    <div id="finalScores"></div>
    <div class="btnRow">
      <button class="btn primary" id="playAgainBtn">Play Again</button>
      <button class="btn ghost" id="backToLobbyBtn">Back to Menu</button>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
'use strict';
/* ============================================================================
   NEON ARENA — client game logic
   ============================================================================
   HOW THIS CONNECTS TO YOUR SERVER
   ----------------------------------------------------------------------------
   Replace DEFAULT_SERVER_URL below with your deployed Render/Railway URL,
   e.g. "https://my-game-server.onrender.com". Locally (hostname === localhost)
   it automatically points at http://localhost:3001 instead, so you don't have
   to keep editing this file while developing. You can also override it at
   any time with a query string, e.g. index.html?server=http://localhost:3055
   — handy for testing without touching the code.
   ============================================================================ */

// >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> EDIT THIS <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<
const DEFAULT_SERVER_URL = 'https://rounds-server.onrender.com';
// >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>

const SERVER_URL = new URLSearchParams(location.search).get('server')
  || (['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://localhost:3001' : DEFAULT_SERVER_URL);

const PLAYER_COLORS = ['#39ff88', '#ff3b7a', '#3ba7ff', '#ffd23b'];
const POWERUP_LABELS = {
  biggerBullets: 'Bigger Bullets', fasterBullets: 'Faster Bullets', extraHp: 'Extra HP',
  shield: 'Shield', doubleShot: 'Double Shot', speedBoost: 'Speed Boost', regen: 'Regeneration'
};

// ---------------------------------------------------------------------------
// Small utilities
// ---------------------------------------------------------------------------
const $ = sel => document.querySelector(sel);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + diff * t;
}
const showScreen = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); };

// ---------------------------------------------------------------------------
// Global mutable game state
// ---------------------------------------------------------------------------
let socket = null;
let myId = null, myColor = PLAYER_COLORS[0], myName = '';
let arenaCfg = { w: 1600, h: 900, playerRadius: 20, bulletRadius: 6 };
let winScore = 5;

let snapPrev = null, snapCur = null; // last two 'state' broadcasts, for interpolation
let predictedSelf = { x: 0, y: 0, inited: false };
let roomState = 'lobby'; // mirrors server room.state
let inRoom = false, wasInMatch = false;
let lastRoomCode = '', lastPlayerName = '', lastPlayerColor = '';

const particles = []; // {x,y,vx,vy,life,maxLife,color,size,kind}
const killFeedEl = $('#killFeed');
let prevPlayersById = new Map(); // for diffing hp/alive/powerups between snapshots

// ---------------------------------------------------------------------------
// Canvas setup / responsive sizing
// ---------------------------------------------------------------------------
const canvas = $('#gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = $('#canvasWrap');
  const availW = wrap.clientWidth, availH = wrap.clientHeight;
  const arenaAspect = arenaCfg.w / arenaCfg.h;
  let cssW = availW, cssH = availW / arenaAspect;
  if (cssH > availH) { cssH = availH; cssW = availH * arenaAspect; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr * (cssW / arenaCfg.w), 0, 0, dpr * (cssH / arenaCfg.h), 0, 0);
}
window.addEventListener('resize', resizeCanvas);

// Convert a page-space pointer/touch coordinate into arena logical coordinates.
function pageToArena(px, py) {
  const rect = canvas.getBoundingClientRect();
  const nx = (px - rect.left) / rect.width;
  const ny = (py - rect.top) / rect.height;
  return { x: nx * arenaCfg.w, y: ny * arenaCfg.h };
}

// ---------------------------------------------------------------------------
// Lobby screen wiring
// ---------------------------------------------------------------------------
(function buildColorPicker() {
  const row = $('#colorRow');
  PLAYER_COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'colorSwatch' + (i === 0 ? ' sel' : '');
    el.style.background = c;
    el.style.boxShadow = `0 0 14px ${c}66`;
    el.onclick = () => {
      row.querySelectorAll('.colorSwatch').forEach(s => s.classList.remove('sel'));
      el.classList.add('sel');
      myColor = c;
    };
    row.appendChild(el);
  });
})();

$('#roomCodeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });

$('#joinBtn').onclick = () => {
  myName = $('#nameInput').value.trim() || 'Player';
  const roomCode = $('#roomCodeInput').value.trim().toUpperCase();
  setLobbyError('');
  connectAndJoin(roomCode, myName, myColor);
};

$('#leaveLobbyBtn').onclick = () => { leaveEverything(); };
$('#startMatchBtn').onclick = () => { if (socket) socket.emit('startMatch'); };
$('#leaveBtn').onclick = () => { leaveEverything(); };
$('#backToLobbyBtn').onclick = () => { leaveEverything(); };
$('#playAgainBtn').onclick = () => { if (socket) socket.emit('playAgain'); };

function setLobbyError(msg) { $('#lobbyError').textContent = msg || ''; }

function connectAndJoin(roomCode, name, color) {
  $('#joinBtn').disabled = true;
  if (socket) { socket.removeAllListeners(); socket.disconnect(); }
  // Stash these BEFORE connecting — the single 'connect' handler in
  // wireSocketEvents() uses them for both the first join and any later
  // auto-reconnect, so there is only ever one join attempt per connection.
  lastRoomCode = roomCode; lastPlayerName = name; lastPlayerColor = color;
  socket = io(SERVER_URL, { transports: ['websocket', 'polling'], reconnectionAttempts: 6 });
  wireSocketEvents();

  socket.on('connect_error', () => {
    setLobbyError(`Could not reach the server at ${SERVER_URL}. Check the URL at the top of this file / your connection.`);
    $('#joinBtn').disabled = false;
  });
}

function leaveEverything() {
  if (socket) { socket.emit('leaveRoom'); socket.disconnect(); socket = null; }
  inRoom = false; wasInMatch = false; myId = null;
  snapPrev = snapCur = null; predictedSelf.inited = false;
  particles.length = 0; killFeedEl.innerHTML = '';
  $('#joinCard').style.display = 'block';
  $('#roomPanel').style.display = 'none';
  $('#startMatchBtn').disabled = true;
  showScreen('#lobbyScreen');
}

// ---------------------------------------------------------------------------
// Socket event wiring (shared by initial connect and auto-reconnect)
// ---------------------------------------------------------------------------
function wireSocketEvents() {
  socket.on('lobbyUpdate', data => {
    roomState = data.state;
    renderRoster(data.players);
    $('#startMatchBtn').disabled = data.players.length < data.minPlayers;
    if (data.state === 'lobby' && wasInMatch) {
      // Dropped back to lobby (someone left mid-match) — show the lobby card again.
      wasInMatch = false;
      showScreen('#lobbyScreen');
      $('#joinCard').style.display = 'none';
      $('#roomPanel').style.display = 'block';
    }
  });

  socket.on('state', data => {
    if (!wasInMatch) { wasInMatch = true; showScreen('#gameScreen'); resizeCanvas(); }
    roomState = data.state;
    diffForEffects(data);
    snapPrev = snapCur;
    snapCur = data;
    if (!snapPrev) snapPrev = data;
  });

  socket.on('death', d => {
    const p = findPlayerInSnap(d.id);
    if (p) spawnDeathBurst(p.x, p.y, p.color);
    pushKillFeed(d);
  });

  socket.on('matchEnd', data => showVictory(data));

  socket.on('playerLeft', () => { /* roster already updated via lobbyUpdate */ });

  socket.on('disconnect', () => {
    if (inRoom) $('#reconnectOverlay').classList.add('on');
  });

  // Single 'connect' handler for the whole socket lifecycle: it fires once on
  // the very first connection (joins fresh, room may be created) AND on every
  // subsequent auto-reconnect (rejoins lastRoomCode, which by then holds the
  // server-assigned code). Previously this logic was split across two
  // separate 'connect' listeners, which double-emitted 'joinRoom' on every
  // reconnect — fixed by consolidating into this one.
  socket.on('connect', () => {
    $('#reconnectOverlay').classList.remove('on');
    socket.emit('joinRoom', { roomCode: lastRoomCode, name: lastPlayerName, color: lastPlayerColor }, ack => {
      $('#joinBtn').disabled = false;
      if (!ack || !ack.ok) { setLobbyError((ack && ack.error) || 'Could not join room.'); return; }
      myId = ack.playerId;
      arenaCfg = ack.arena;
      winScore = ack.winScore;
      lastRoomCode = ack.roomCode;
      inRoom = true;
      $('#joinCard').style.display = 'none';
      $('#roomPanel').style.display = 'block';
      $('#roomCodeDisplay').textContent = ack.roomCode;
      resizeCanvas();
    });
  });
}

function renderRoster(players) {
  const list = $('#rosterList');
  list.innerHTML = '';
  players.forEach(p => {
    const row = document.createElement('div');
    row.className = 'rosterRow';
    row.innerHTML = `<div class="rosterDot" style="background:${p.color};color:${p.color}"></div>
      <div class="rosterName">${escapeHtml(p.name)}${p.id === myId ? ' (you)' : ''}</div>
      <div class="rosterScore">${p.score} pt</div>`;
    list.appendChild(row);
  });
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function findPlayerInSnap(id) {
  return snapCur && snapCur.players.find(p => p.id === id);
}

function pushKillFeed(d) {
  const victim = (snapCur && snapCur.players.find(p => p.id === d.id)) || {};
  const killer = (snapCur && snapCur.players.find(p => p.id === d.killerId)) || {};
  const toast = document.createElement('div');
  toast.className = 'killToast';
  const puLabel = POWERUP_LABELS[d.powerup] || d.powerup;
  toast.innerHTML = `<b style="color:${killer.color || '#fff'}">${escapeHtml(killer.name || '???')}</b> eliminated
    <b style="color:${victim.color || '#fff'}">${escapeHtml(victim.name || '???')}</b>
    <div style="color:var(--dim);font-size:10.5px;margin-top:2px">+ ${escapeHtml(puLabel)} for ${escapeHtml(victim.name || 'them')}</div>`;
  killFeedEl.appendChild(toast);
  setTimeout(() => toast.remove(), 3100);
}

// ---------------------------------------------------------------------------
// Diff-based particle triggers — the server never sends particle events
// directly; the client infers "something happened" from state deltas, which
// keeps the network protocol small.
// ---------------------------------------------------------------------------
function diffForEffects(data) {
  data.players.forEach(p => {
    const prev = prevPlayersById.get(p.id);
    if (prev) {
      if (p.hp < prev.hp && p.alive) spawnHitSpark(p.x, p.y, p.color);
      Object.keys(p.powerups || {}).forEach(k => {
        if ((p.powerups[k] || 0) > (prev.powerups[k] || 0)) spawnPowerupSparkle(p.x, p.y - 30, p.color, POWERUP_LABELS[k]);
      });
      if (p.shieldFlash && !prev.shieldFlash) spawnShieldFlash(p.x, p.y, p.color);
    }
    prevPlayersById.set(p.id, p);
  });
}

// ---------------------------------------------------------------------------
// Particle system
// ---------------------------------------------------------------------------
function spawnHitSpark(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 140;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, maxLife: 0.35 + Math.random() * 0.15, color, size: 2 + Math.random() * 2, kind: 'spark' });
  }
}
function spawnDeathBurst(x, y, color) {
  for (let i = 0; i < 36; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 260;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, maxLife: 0.5 + Math.random() * 0.5, color, size: 2 + Math.random() * 4, kind: 'spark' });
  }
  particles.push({ x, y, vx: 0, vy: 0, life: 0, maxLife: 0.6, color, size: 4, kind: 'ring' });
}
function spawnPowerupSparkle(x, y, color, label) {
  particles.push({ x, y, vx: 0, vy: -40, life: 0, maxLife: 1.3, color, size: 0, kind: 'text', text: '+' + label });
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 90;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0, maxLife: 0.6, color, size: 2 + Math.random() * 2, kind: 'spark' });
  }
}
function spawnShieldFlash(x, y, color) {
  particles.push({ x, y, vx: 0, vy: 0, life: 0, maxLife: 0.35, color, size: 26, kind: 'ring' });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'spark') { p.vx *= 0.92; p.vy *= 0.92; }
  }
}
function drawParticles() {
  particles.forEach(p => {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = 1 - t;
    if (p.kind === 'spark') {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - t * 0.4), 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'ring') {
      ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size + t * 50, 0, Math.PI * 2); ctx.stroke();
    } else if (p.kind === 'text') {
      ctx.fillStyle = p.color; ctx.font = '700 15px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    }
  });
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// Input — keyboard/mouse (desktop) and dual joysticks (touch)
// ---------------------------------------------------------------------------
const keys = new Set();
let mousePage = { x: innerWidth / 2, y: innerHeight / 2 };
let mouseFireHeld = false;
window.addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
canvas.addEventListener('mousemove', e => { mousePage.x = e.clientX; mousePage.y = e.clientY; });
canvas.addEventListener('mousedown', () => { mouseFireHeld = true; });
window.addEventListener('mouseup', () => { mouseFireHeld = false; });

function keyboardMoveVector() {
  let mx = 0, my = 0;
  if (keys.has('w') || keys.has('arrowup')) my -= 1;
  if (keys.has('s') || keys.has('arrowdown')) my += 1;
  if (keys.has('a') || keys.has('arrowleft')) mx -= 1;
  if (keys.has('d') || keys.has('arrowright')) mx += 1;
  return { mx, my };
}

// ---- touch joysticks ----
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const JOY_RADIUS = 55;
const joyState = {
  left: { active: false, id: null, dx: 0, dy: 0, baseX: 0, baseY: 0 },
  right: { active: false, id: null, dx: 0, dy: 0, baseX: 0, baseY: 0 }
};

function setupJoystick(zoneEl, baseEl, stickEl, state) {
  if (!isTouchDevice) { zoneEl.style.display = 'none'; return; }
  const start = e => {
    const t = e.changedTouches[0];
    state.active = true; state.id = t.identifier;
    state.baseX = t.clientX; state.baseY = t.clientY;
    baseEl.style.display = 'block';
    baseEl.style.left = (t.clientX - 55) + 'px';
    baseEl.style.top = (t.clientY - 55) + 'px';
    stickEl.style.left = '30px'; stickEl.style.top = '30px';
    stickEl.classList.add('active');
    e.preventDefault();
  };
  const move = e => {
    if (!state.active) return;
    const t = [...e.changedTouches].find(t => t.identifier === state.id);
    if (!t) return;
    let dx = t.clientX - state.baseX, dy = t.clientY - state.baseY;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) { dx = dx / dist * JOY_RADIUS; dy = dy / dist * JOY_RADIUS; }
    state.dx = dx / JOY_RADIUS; state.dy = dy / JOY_RADIUS;
    stickEl.style.left = (30 + dx) + 'px'; stickEl.style.top = (30 + dy) + 'px';
    e.preventDefault();
  };
  const end = e => {
    const t = [...e.changedTouches].find(t => t.identifier === state.id);
    if (!t && e.type !== 'touchcancel') return;
    state.active = false; state.dx = 0; state.dy = 0;
    baseEl.style.display = 'none';
    stickEl.classList.remove('active');
    e.preventDefault();
  };
  zoneEl.addEventListener('touchstart', start, { passive: false });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', end, { passive: false });
  window.addEventListener('touchcancel', end, { passive: false });
}
setupJoystick($('#joyLeftZone'), $('#joyLeftBase'), $('#joyLeftStick'), joyState.left);
setupJoystick($('#joyRightZone'), $('#joyRightBase'), $('#joyRightStick'), joyState.right);

// Combine every input source into one payload sent to the server. Touch takes
// priority when active (mobile), otherwise keyboard+mouse (desktop).
function computeInput() {
  let mx = 0, my = 0, aim = predictedSelf.aim || 0, fire = false;

  if (joyState.left.active) { mx = joyState.left.dx; my = joyState.left.dy; }
  else { const kb = keyboardMoveVector(); mx = kb.mx; my = kb.my; }

  if (joyState.right.active) {
    const dist = Math.hypot(joyState.right.dx, joyState.right.dy);
    if (dist > 0.18) { aim = Math.atan2(joyState.right.dy, joyState.right.dx); fire = true; }
  } else {
    const selfScreen = arenaToPage(predictedSelf.x, predictedSelf.y);
    aim = Math.atan2(mousePage.y - selfScreen.y, mousePage.x - selfScreen.x);
    fire = mouseFireHeld || keys.has(' ');
  }
  predictedSelf.aim = aim;
  return { mx, my, aim, fire };
}

function arenaToPage(ax, ay) {
  const rect = canvas.getBoundingClientRect();
  return { x: rect.left + (ax / arenaCfg.w) * rect.width, y: rect.top + (ay / arenaCfg.h) * rect.height };
}

// Send input to the server at a steady rate — independent of render FPS.
setInterval(() => {
  if (socket && socket.connected && inRoom && (roomState === 'round' || roomState === 'countdown')) {
    socket.emit('input', computeInput());
  }
}, 50);

// ---------------------------------------------------------------------------
// Client-side prediction (self) + interpolation (everyone else / bullets)
// ---------------------------------------------------------------------------
// Approximate per-player speed used ONLY for smoothing local prediction;
// the server remains authoritative and we gently correct toward it every
// snapshot, so any drift self-heals within a fraction of a second.
function selfSpeedGuess() {
  const me = snapCur && snapCur.players.find(p => p.id === myId);
  const boost = me ? (me.powerups.speedBoost || 0) : 0;
  return 260 * (1 + boost * 0.10);
}

function updatePrediction(dt) {
  const me = snapCur && snapCur.players.find(p => p.id === myId);
  if (!me) return;
  if (!predictedSelf.inited) { predictedSelf.x = me.x; predictedSelf.y = me.y; predictedSelf.inited = true; }

  if (me.alive && (roomState === 'round')) {
    const input = computeInput();
    let mx = input.mx, my = input.my;
    const mag = Math.hypot(mx, my);
    if (mag > 1) { mx /= mag; my /= mag; }
    const speed = selfSpeedGuess();
    predictedSelf.x += mx * speed * dt;
    predictedSelf.y += my * speed * dt;
    predictedSelf.x = clamp(predictedSelf.x, arenaCfg.playerRadius, arenaCfg.w - arenaCfg.playerRadius);
    predictedSelf.y = clamp(predictedSelf.y, arenaCfg.playerRadius, arenaCfg.h - arenaCfg.playerRadius);
  }
  // Gently reconcile toward the server's authoritative position — corrects
  // for knockback, wall clamps, and any prediction drift without visible pops.
  predictedSelf.x = lerp(predictedSelf.x, me.x, 0.18);
  predictedSelf.y = lerp(predictedSelf.y, me.y, 0.18);
}

// Interpolation factor between the last two snapshots, based on wall-clock
// time so remote players/bullets glide smoothly between the ~33ms server ticks.
function interpFactor() {
  if (!snapPrev || !snapCur || snapCur.t === snapPrev.t) return 1;
  const span = snapCur.t - snapPrev.t;
  const elapsed = Date.now() - snapCur.t;
  return clamp(elapsed / span, 0, 1.5);
}

function interpPos(prevList, curP) {
  const prevP = prevList && prevList.find(x => x.id === curP.id);
  if (!prevP) return { x: curP.x, y: curP.y };
  const t = interpFactor();
  return { x: lerp(prevP.x, curP.x, t), y: lerp(prevP.y, curP.y, t) };
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function drawArena() {
  ctx.fillStyle = '#060810';
  ctx.fillRect(0, 0, arenaCfg.w, arenaCfg.h);

  // grid
  ctx.strokeStyle = 'rgba(60,80,130,0.12)';
  ctx.lineWidth = 1;
  const step = 80;
  for (let x = 0; x <= arenaCfg.w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, arenaCfg.h); ctx.stroke(); }
  for (let y = 0; y <= arenaCfg.h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(arenaCfg.w, y); ctx.stroke(); }

  // border glow
  ctx.strokeStyle = '#233252'; ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, arenaCfg.w - 6, arenaCfg.h - 6);
  ctx.save();
  ctx.shadowColor = '#39ff8855'; ctx.shadowBlur = 20;
  ctx.strokeStyle = 'rgba(57,255,136,.25)'; ctx.lineWidth = 2;
  ctx.strokeRect(3, 3, arenaCfg.w - 6, arenaCfg.h - 6);
  ctx.restore();
}

function drawPlayer(p, pos, isSelf) {
  const r = arenaCfg.playerRadius;
  if (!p.alive) {
    // faint ghost marker for spectating (mid-match joiners / this round's dead)
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = p.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }

  // shield ring
  if (p.shieldActive) {
    ctx.save();
    ctx.strokeStyle = '#8ecbffcc'; ctx.lineWidth = 3;
    ctx.shadowColor = '#8ecbff'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, r + 8, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // body glow
  ctx.save();
  ctx.shadowColor = p.color; ctx.shadowBlur = isSelf ? 26 : 16;
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // outline ring for self
  if (isSelf) {
    ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, r + 3, 0, Math.PI * 2); ctx.stroke();
  }

  // aim direction nub
  ctx.fillStyle = '#ffffffdd';
  const nx = pos.x + Math.cos(p.aim) * (r + 6), ny = pos.y + Math.sin(p.aim) * (r + 6);
  ctx.beginPath(); ctx.arc(nx, ny, 3.5, 0, Math.PI * 2); ctx.fill();

  // name + hp bar
  ctx.textAlign = 'center';
  ctx.font = '600 12px system-ui';
  ctx.fillStyle = '#dbe4ffcc';
  ctx.fillText(p.name, pos.x, pos.y - r - 20);

  const barW = 42, barH = 5;
  ctx.fillStyle = '#1c2436';
  ctx.fillRect(pos.x - barW / 2, pos.y - r - 14, barW, barH);
  ctx.fillStyle = p.hp > p.maxHp * 0.3 ? p.color : '#ff3b3b';
  ctx.fillRect(pos.x - barW / 2, pos.y - r - 14, barW * clamp(p.hp / p.maxHp, 0, 1), barH);
}

function drawBullet(b, pos) {
  ctx.save();
  ctx.shadowColor = b.color; ctx.shadowBlur = 12;
  ctx.fillStyle = b.color;
  ctx.beginPath(); ctx.arc(pos.x, pos.y, b.radius, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, arenaCfg.w, arenaCfg.h);
  drawArena();

  if (snapCur) {
    const t = interpFactor();
    snapCur.bullets.forEach(b => {
      const prevB = snapPrev && snapPrev.bullets.find(x => x.id === b.id);
      const pos = prevB ? { x: lerp(prevB.x, b.x, t), y: lerp(prevB.y, b.y, t) } : { x: b.x, y: b.y };
      drawBullet(b, pos);
    });

    snapCur.players.forEach(p => {
      const isSelf = p.id === myId;
      const pos = isSelf ? predictedSelf : interpPos(snapPrev.players, p);
      drawPlayer(p, pos, isSelf);
    });
  }

  drawParticles();

  // center banner: countdown / waiting text
  const banner = $('#centerBanner');
  if (roomState === 'countdown' && snapCur) {
    const secs = Math.ceil(snapCur.countdownMs / 1000);
    banner.innerHTML = `<div class="big">${secs > 0 ? secs : 'GO'}</div><div class="small">Round starting</div>`;
  } else {
    banner.innerHTML = '';
  }
}

// ---------------------------------------------------------------------------
// HUD (score board, own health/powerups) — updated once per snapshot, not
// every render frame, since it doesn't need 60fps refresh.
// ---------------------------------------------------------------------------
function updateHud() {
  if (!snapCur) return;
  const board = $('#scoreBoard');
  board.innerHTML = snapCur.players.map(p => `
    <div class="scorePip" style="color:${p.color}">
      <span class="dot" style="background:${p.color}"></span>${p.score}
    </div>`).join('');

  const me = snapCur.players.find(p => p.id === myId);
  if (!me) return;

  const hearts = $('#selfHearts');
  hearts.innerHTML = '';
  const full = Math.floor(me.hp), frac = me.hp - full;
  for (let i = 0; i < me.maxHp; i++) {
    const filled = i < full ? 1 : (i === full && frac > 0.01 ? frac : 0);
    hearts.appendChild(heartSvg(me.color, filled));
  }

  const puWrap = $('#selfPowerups');
  puWrap.innerHTML = '';
  Object.entries(me.powerups || {}).forEach(([k, v]) => {
    if (!v) return;
    const chip = document.createElement('div');
    chip.className = 'puChip';
    chip.innerHTML = `${POWERUP_LABELS[k] || k} <b>x${v}</b>`;
    puWrap.appendChild(chip);
  });
}
function heartSvg(color, fill) {
  const wrap = document.createElement('div');
  wrap.className = 'heart';
  const pct = Math.round(fill * 100);
  wrap.innerHTML = `<svg viewBox="0 0 24 24"><defs><clipPath id="clip"><rect x="0" y="0" width="${24 * fill}" height="24"/></clipPath></defs>
    <path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.3 4.8 5.6 4.2 8 3.8 10.3 5 12 7c1.7-2 4-3.2 6.4-2.8 3.3.6 5.2 4 3.6 7.5C19.5 16.4 12 21 12 21z" fill="#232c42"/>
    <path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.3 4.8 5.6 4.2 8 3.8 10.3 5 12 7c1.7-2 4-3.2 6.4-2.8 3.3.6 5.2 4 3.6 7.5C19.5 16.4 12 21 12 21z" fill="${color}" clip-path="url(#clip)"/></svg>`;
  return wrap;
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (document.getElementById('gameScreen').classList.contains('on')) {
    updatePrediction(dt);
    updateParticles(dt);
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(updateHud, 80); // HUD DOM updates don't need to run every rAF tick

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---------------------------------------------------------------------------
// Victory screen + confetti
// ---------------------------------------------------------------------------
const confettiCanvas = $('#confettiCanvas');
const cctx = confettiCanvas.getContext('2d');
let confetti = [];
let confettiRunning = false;

function showVictory(data) {
  showScreen('#matchEndScreen');
  const winner = data.players.find(p => p.id === data.winnerId) || {};
  $('#victoryName').textContent = winner.name || '???';
  $('#victoryName').style.color = winner.color || '#fff';
  $('#victoryTitle').textContent = winner.id === myId ? 'VICTORY' : 'MATCH OVER';

  const sorted = [...data.players].sort((a, b) => b.score - a.score);
  $('#finalScores').innerHTML = sorted.map(p => `
    <div class="finalCard" style="border-color:${p.color}55">
      <div class="n" style="color:${p.color}">${escapeHtml(p.name)}</div>
      <div class="s">${p.score}</div>
    </div>`).join('');

  startConfetti(winner.color || '#39ff88');
}

function resizeConfetti() { confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function startConfetti(mainColor) {
  confetti = [];
  const palette = [mainColor, ...PLAYER_COLORS];
  for (let i = 0; i < 160; i++) {
    confetti.push({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight,
      vy: 120 + Math.random() * 180, vx: (Math.random() - 0.5) * 80,
      size: 5 + Math.random() * 7, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 6,
      color: palette[Math.floor(Math.random() * palette.length)]
    });
  }
  if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiFrame); }
}
let lastConfettiT = performance.now();
function confettiFrame(now) {
  const dt = Math.min(0.05, (now - lastConfettiT) / 1000);
  lastConfettiT = now;
  const onScreen = document.getElementById('matchEndScreen').classList.contains('on');
  if (!onScreen) { confettiRunning = false; return; }
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confetti.forEach(c => {
    c.y += c.vy * dt; c.x += c.vx * dt; c.rot += c.vr * dt;
    if (c.y > innerHeight + 20) { c.y = -20; c.x = Math.random() * innerWidth; }
    cctx.save();
    cctx.translate(c.x, c.y); cctx.rotate(c.rot);
    cctx.fillStyle = c.color;
    cctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
    cctx.restore();
  });
  requestAnimationFrame(confettiFrame);
}
</script>
</body>
